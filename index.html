<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AtithiFusion Airbnb Clone</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Noto+Sans+Devanagari&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1>AtithiFusion Airbnb Clone</h1>
  </header>

  <main class="container">
    <!-- Listings Section -->
    <section class="listings" id="listings">
      <!-- JS will populate cards here -->
    </section>

    <!-- Chatbot Section -->
    <section class="chatbot-container">
      <img src="images/chatbot-avatar.png" alt="AtithiFusion" class="avatar"/>
      <div id="chat-window" class="chat-window"></div>
      <div class="chat-input">
        <input id="chat-input" type="number" placeholder="Enter your budget (₹)" min="0"/>
        <button id="send-button">Send</button>
      </div>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
