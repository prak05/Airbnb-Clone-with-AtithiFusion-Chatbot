<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airbnb Clone</title>
    <link rel="stylesheet" href="layout.css">
</head>
<body>
    <header>
        <div class="logo">Airbnb Clone</div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Listings</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="hero">
            <h1>Welcome to Airbnb Clone</h1>
            <p>Book unique homes and experiences all over the world.</p>
            <button onclick="alert('Search functionality not implemented yet!')">Search</button>
        </section>
        <section class="listings">
            <h2>Featured Listings</h2>
            <div class="listing">
                <img src="https://via.placeholder.com/300" alt="Listing 1">
                <h3>Cozy Cottage</h3>
                <p>$120 per night</p>
            </div>
            <div class="listing">
                <img src="https://via.placeholder.com/300" alt="Listing 2">
                <h3>Modern Apartment</h3>
                <p>$150 per night</p>
            </div>
            <div class="listing">
                <img src="https://via.placeholder.com/300" alt="Listing 3">
                <h3>Beach House</h3>
                <p>$200 per night</p>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Airbnb Clone. All rights reserved.</p>
    </footer>
    <script src="jvascrpt.js"></script>
</body>
</html>
